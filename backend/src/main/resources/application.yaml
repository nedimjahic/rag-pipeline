server:
  port: 8081
spring:
  application:
    name: pipeline
  datasource:
    url: jdbc:postgresql://localhost:5432/ragdb
    username: rag
    password: rag
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: llama3.2
        temperature: 0.7
      embedding:
        model: nomic-embed-text
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 768        # nomic-embed-text outputs 768-dim vectors
        index-type: hnsw

logging:
  level:
    org.springframework.ai: DEBUG
    web: DEBUG